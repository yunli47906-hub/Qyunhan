[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qyunhan"
version = "0.1.0"
description = "Program-resolution virtual cell with calibrated abstention"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.22"]
keywords = ["virtual cell", "perturbation response", "conformal prediction",
            "selective prediction", "tuberculosis"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Repository = "https://github.com/yunli47906-hub/Qyunhan"

[tool.setuptools]
packages = ["qyunhan"]
